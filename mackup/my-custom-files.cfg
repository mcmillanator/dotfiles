[application]
name = my-custom-files

# Folders that must be visible in the repo but hidden in $HOME (config/,
# devcontainers/, mackup/, omz_custom/, tmux/, ssh/) are linked by install.sh
# instead -- mackup always uses the same path in storage and in home.
[configuration_files]
.inputrc
.ruby-version
.tmux.conf.local
.tmux.remote.conf
