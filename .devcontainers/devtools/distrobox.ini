# distrobox.ini — declarative distrobox containers for the devtools toolbelt.
#
#   distrobox assemble create --file ~/.devcontainers/devtools/distrobox.ini
#   distrobox assemble rm     --file ~/.devcontainers/devtools/distrobox.ini
#
# Distrobox shares your host $HOME, so the toolbelt (~/.local/share/devtools,
# put on PATH by ~/.omz_custom/devtools.zsh) and your dotfiles are already present
# in every container. The only per-container work is the OS-level bits each
# distro doesn't ship — here, a shell + core utils.
#
# `additional_packages` is idempotent and runs on every start, so it's safe.

[dev-fedora]
image=fedora:latest
additional_packages="zsh git tmux curl unzip"
replace=true
start_now=false

[dev-ubuntu]
image=ubuntu:latest
additional_packages="zsh git tmux curl unzip"
replace=true
start_now=false
